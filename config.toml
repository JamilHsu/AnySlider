enabled = true
dll = ["AnySlider.dll"]
name = "AnySlider"
description = "Allows any controllers to use Mega Mix+'s native arcade slider."
version = "2.0"
author = "sam_nya"

# Specify the VID:PIDs of devices to emulate as HORI controllers; leave the list empty to match all devices.
# 054C:05C4 is a common VID:PID used by the ViGEm virtual controller driver.
vid_pids = ["054C:05C4"]
# Target controller type for device remapping.
# 6 = HORI NSW-230 Mega39's, 7 = HORI PS4-161 Future Tone DX.
target_controller_type = 7

# ============================
# AnySlider IO
# ============================

# Master IO switch.
io_enabled = false
# Debug logging.
debug = false
# External shared-memory input name.
io_shared_memory = "Local\\MMIO_SHARED_BUFFER"
# Input lease duration in milliseconds; release input when the lease expires.
io_max_input_lease_ms = 500
# Exclusive game input (blocks the game's native input path so input is supplied only by the mod).
io_exclusive_controller_input = false
# Keep the game running when it is not in the foreground.
io_keep_game_active_unfocused = false

# ============================
# General Input Settings
# ============================

# Controller type emulated by IO.
# -1 = auto (DualSense by default; automatically switches to the Nintendo layout).
# 2=DS4, 3=DualSense, 4=Nintendo, 5=Xbox, 6=HORI Mega39s, 7=HORI Future Tone.
io_controller_type = -1
# Slider mode for keyboard left/right input and the left/right gamepad sticks:
# "arcade" emulates keyboard/gamepad directions as movement across the slider (e.g. right simulates a swipe from left to right).
# "joystick" maps keyboard/gamepad directions to the game's built-in left/right input.
io_slider_mode = "arcade"
# Slider emulation speed in Arcade mode, in cells per second.
# Only affects left/right directional input, not direct 32-cell input or mouse_as_slider mode.
io_arcade_slider_emu_cells_per_second = 32.0
# Use Circle to confirm and Cross to go back in game menus.
io_use_ps_circle_confirm = false
# Swap UI button icons; requires Circle confirmation. Disable if UI issues or mod conflicts occur.
io_swap_ox_sprite = true
# Keep mouse input available when a controller is connected.
io_show_mouse_with_controller = true

# ============================
# Keyboard/Mouse Input Settings (use AnySlider instead of the game's native keyboard/mouse input)
# ============================

# Built-in keyboard/mouse frontend; the game processes it as controller input.
io_keyboard_mouse_frontend = false
# Block the game's native keyboard/mouse input to prevent duplicate input.
io_block_keyboard_input = false
io_block_mouse_input = false

# Use mouse input as a slider, for example with a controller that has two knobs.
io_use_mouse_as_slider = false
# Mouse axis to bind: usually "x" or "y"; "wheel" is also supported.
# Note: slider_1 is the left half and slider_2 is the right half of the slider.
io_mouse_slider_1_axis = "x"
io_mouse_slider_2_axis = "y"
# Reverse the direction.
io_mouse_slider_1_invert = false
io_mouse_slider_2_invert = false
# Mouse sensitivity.
io_mouse_slider_1_sensitivity = 1.0
io_mouse_slider_2_sensitivity = 1.0
# Time in milliseconds after movement stops before releasing the simulated touch.
io_mouse_slider_touch_hold_ms = 20
# Mouse device VID:PID; leave empty to accept all mice.
io_mouse_slider_device = ""

# ============================
# Gamepad Input Settings (use AnySlider instead of the game's native gamepad input)
# ============================

# Gamepad frontend; supports DS4, DualSense, Pro Controller and Joy-Con.
io_gamepad_frontend = false
# Automatically detect the controller type.
io_gamepad_device = "auto"
# Use the DS4/DualSense touchpad as slider input.
io_gamepad_touchpad_slider = true
# Reverse the touchpad left/right direction.
io_gamepad_touchpad_invert = false
# Stick deadzone, from 0.1 to 0.95.
io_gamepad_stick_slider_deadzone = 0.5

# ============================
# Arcade IO Settings
# Three components: IO3 (+ AMEX), slider and touchscreen.
# ============================

# === IO3 Settings ===
# Enable the IO3 connection (requires an AMEX board).
io_io3_backend = false
# Wait time between input polls in milliseconds; normally no adjustment is needed.
io_io3_poll_interval_ms = 4
# AMEX timeout in milliseconds.
io_io3_timeout_ms = 1000
# Button lamp feedback follows physical positions rather than in-game button bindings.
io_io3_led_use_hardware_position = true

# === Arcade Slider ===
# Enable the arcade slider connection.
io_arcade_slider_backend = false
# Arcade slider serial port; defaults to COM11.
io_arcade_slider_port = "COM11"
# Some USB-to-serial adapters require DTR/RTS assertion to communicate; try disabling this if a motherboard-native serial port has connection issues.
io_arcade_slider_dtr_rts = true

# === Arcade Serial Touchscreen ===
# Enable the SEGA838-14772 arcade touchscreen connection (not needed for WinTouch touchscreens).
io_arcade_touchscreen_backend = false
# Arcade touchscreen serial port; defaults to COM1.
io_arcade_touchscreen_port = "COM1"

# === Arcade Lighting ===
# Generate lighting effects modeled after the arcade version.
io_arcade_led = true
# Use the song-loading progress animation.
io_arcade_led_loading_progress = true

# Enable the arcade TEST MODE menu.
io_enable_test_mode = false


# ============================
# Key Bindings
# ============================
# Unified action bindings currently support keyboard keys/VK codes (e.g. 0x41) and IO3_Triangle/Square/Cross/Circle/Start/Service/Test.
io_key_test = ["F1", "IO3_Test"]
io_key_service = ["F2", "IO3_Service"]
io_key_pause = ["Escape", "IO3_Start"]
io_key_start = ["Enter"]
io_key_dpad_up = ["Up"]
io_key_dpad_down = ["Down"]
io_key_dpad_left = ["Left"]
io_key_dpad_right = ["Right"]
io_key_triangle = ["W", "IO3_Triangle"]
io_key_square = ["A", "IO3_Square"]
io_key_cross = ["S", "IO3_Cross"]
io_key_circle = ["D", "IO3_Circle"]
io_key_l1 = ["Z"]
io_key_r1 = ["X"]
io_key_l2 = []
io_key_r2 = []
io_key_select = []
io_key_l3 = []
io_key_r3 = []
# Keys for emulating slider directions.
io_key_slider_1_left = ["Q"]
io_key_slider_1_right = ["E"]
io_key_slider_2_left = ["U"]
io_key_slider_2_right = ["O"]
# Bind individual slider cells to keyboard keys.
io_key_slider_01 = []
io_key_slider_02 = []
io_key_slider_03 = []
io_key_slider_04 = []
io_key_slider_05 = []
io_key_slider_06 = []
io_key_slider_07 = []
io_key_slider_08 = []
io_key_slider_09 = []
io_key_slider_10 = []
io_key_slider_11 = []
io_key_slider_12 = []
io_key_slider_13 = []
io_key_slider_14 = []
io_key_slider_15 = []
io_key_slider_16 = []
io_key_slider_17 = []
io_key_slider_18 = []
io_key_slider_19 = []
io_key_slider_20 = []
io_key_slider_21 = []
io_key_slider_22 = []
io_key_slider_23 = []
io_key_slider_24 = []
io_key_slider_25 = []
io_key_slider_26 = []
io_key_slider_27 = []
io_key_slider_28 = []
io_key_slider_29 = []
io_key_slider_30 = []
io_key_slider_31 = []
io_key_slider_32 = []


# === Diagnostics ===
io_input_diagnostics = false
# -1=normal native/slider decision, 0=force non-arcade, 1=force arcade.
io_input_diagnostics_arcade = -1
io_led_diagnostics = false
